        "amountIdr": 35000,
        "transactionDate": "2026-06-02T12:00:00+07:00",
        "notes": "Manual entry"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
