info:
  name: Create Category
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/categories"
  body:
    type: json
    data: |-
      {
        "name": "Kopi",
        "kind": "expense",
        "color": "#8B5CF6",
        "icon": "coffee"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
