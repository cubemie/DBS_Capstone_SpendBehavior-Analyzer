info:
  name: Update Category
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/categories/{{categoryId}}"
  body:
    type: json
    data: |-
      {
        "name": "Kopi Harian",
        "color": "#7C3AED"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
