services:
  postgrns:
    image: postgres:18-alpine
    container_name: sba-local-db
    environment:
      POSTGRES_DB: sba_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
